stages:
  - build
  - docker

variables:
  GO_VERSION: "1.25"
  NODE_VERSION: "23"
  ZIG_VERSION: "0.14.1"
  IMAGE: $CI_REGISTRY_IMAGE

.rules_template: &common_rules
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'

build_binaries:
  stage: build
  image: golang:${GO_VERSION}-bookworm
  <<: *common_rules
  script:
    - apt-get update && apt-get install -y --no-install-recommends curl wget xz-utils
    - curl -fsSL https://deb.nodesource.com/setup_${NODE_VERSION}.x | bash -
    - apt-get install -y nodejs
    - git clone -b keep-cfaccess --single-branch https://gitlab.com/raymao96/komari-web komari-web
    - cd komari-web && npm install && npm run build && cd ..
    - mkdir -p web/public/defaultTheme/dist
    - rm -rf web/public/defaultTheme/dist/*
    - cp -r komari-web/dist/* web/public/defaultTheme/dist/
    - cp -f komari-web/komari-theme.json web/public/defaultTheme/
    - if [ -f komari-web/preview.png ]; then cp -f komari-web/preview.png web/public/defaultTheme/; fi
    - if [ -f komari-web/perview.png ]; then cp -f komari-web/perview.png web/public/defaultTheme/; fi
    - if [ -f web/public/defaultTheme/preview.png ] && [ ! -f web/public/defaultTheme/perview.png ]; then cp -f web/public/defaultTheme/preview.png web/public/defaultTheme/perview.png; fi
    - if [ -f web/public/defaultTheme/perview.png ] && [ ! -f web/public/defaultTheme/preview.png ]; then cp -f web/public/defaultTheme/perview.png web/public/defaultTheme/preview.png; fi

    - wget https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz
    - tar -C /usr/local -Jxf zig-x86_64-linux-${ZIG_VERSION}.tar.xz
    - export PATH=$PATH:/usr/local/zig-x86_64-linux-${ZIG_VERSION}
    - export GOOS=linux
    - export CGO_ENABLED=1
    - export GIN_MODE=release
    - export VERSION="${CI_COMMIT_TAG:-dev}"
    - export VERSION_HASH="${CI_COMMIT_SHA}"
    - export LDFLAGS="-s -w -X github.com/komari-monitor/komari/utils.CurrentVersion=${VERSION} -X github.com/komari-monitor/komari/utils.VersionHash=${VERSION_HASH}"
    - echo "Building for linux/amd64..."
    - GOARCH=amd64 CC="zig cc -target x86_64-linux-musl" go build -a -trimpath -ldflags="$LDFLAGS" -o komari-linux-amd64
    - echo "Building for linux/arm64..."
    - GOARCH=arm64 CC="zig cc -target aarch64-linux-musl" go build -a -trimpath -ldflags="$LDFLAGS" -o komari-linux-arm64
  artifacts:
    paths:
      - komari-linux-amd64
      - komari-linux-arm64
      - web/public/defaultTheme/
    expire_in: 1 hour

docker_build_push:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  <<: *common_rules
  needs:
    - build_binaries
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker run --rm --privileged tonistiigi/binfmt --install all
    - docker context create tls-environment
    - docker buildx create --use --name multiarch-builder tls-environment
  script:
    - TAG="${CI_COMMIT_TAG:-latest}"
    - >
      docker buildx build
      --platform linux/amd64,linux/arm64
      --tag "${IMAGE}:${TAG}"
      --tag "${IMAGE}:latest"
      --provenance=false
      --no-cache
      --push
      .
